# .sops.yaml — lives at the repo root. Declares which recipients can decrypt
# which files. Fill in the real public keys (the `age1...` strings).
keys:
  # Your personal admin key, for editing secrets from your machine:
  #   age-keygen -y ~/.config/sops/age/keys.txt
  - &admin age1n9edxffn86cu4epu964a9wke373ssk4peyer46589rmzp44v6ukqnlql9u

  # One machine key per host. Generate on each host during install with:
  #   age-keygen -y /mnt/persist/var/lib/sops-nix/key.txt
  - &lazarus age12s357h6yln2jamfsxyd9heg8xmxyz0w72w3yvnrgmz4g368t2yssfy0myp
  - &halflight age1tpuhu93ff60wev5ycp2guaer5hzpxh06phgp7d2y2eagz950nqask2vj34

creation_rules:
  # Every secrets/*.yaml is encrypted to you + both hosts.
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *admin
          - *lazarus
          - *halflight
